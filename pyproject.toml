[project]
name = "h1b-pay-explorer"
version = "0.1.0"
description = "Text2SQL agent over every H-1B Labor Condition Application, FY2024 to FY2026 Q3: who sponsors a role, what they pay, and how many lottery entries an offer gets."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.23",
    "google-cloud-aiplatform>=1.40.0",
    "google-cloud-storage>=2.14",
    "duckdb>=1.1",
    "rapidfuzz>=3.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
